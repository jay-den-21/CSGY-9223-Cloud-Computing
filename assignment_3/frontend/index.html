<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HW3 Photo Album Search</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f7f7f7;
      color: #222;
    }

    h1 {
      margin-bottom: 6px;
    }

    h2 {
      margin-top: 0;
    }

    .subtitle {
      color: #555;
      margin-bottom: 24px;
    }

    .section {
      background: #ffffff;
      padding: 20px;
      margin-bottom: 24px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      max-width: 760px;
    }

    input[type="text"] {
      padding: 8px;
      margin: 6px 0;
      width: 360px;
      max-width: 90%;
    }

    input[type="file"] {
      margin: 8px 0;
    }

    button {
      padding: 8px 14px;
      margin-top: 8px;
      cursor: pointer;
    }

    .status {
      margin-top: 10px;
      color: #444;
      font-size: 14px;
    }

    .result-card {
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin: 12px 0;
      max-width: 520px;
    }

    .result-card img {
      max-width: 100%;
      border-radius: 6px;
      margin-top: 8px;
      display: block;
    }

    .small {
      font-size: 13px;
      color: #555;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <h1>Photo Album Search</h1>
  <div class="subtitle">Cloud Computing and Big Data Systems - HW3</div>

  <div class="section">
    <h2>Search Photos</h2>

    <input
      id="searchText"
      type="text"
      placeholder="Example: show me anime"
    />

    <br />

    <button onclick="searchPhotos()">Search</button>

    <div id="searchStatus" class="status"></div>
    <div id="results"></div>
  </div>

  <div class="section">
    <h2>Upload Photo</h2>

    <input
      id="photoFile"
      type="file"
      accept="image/*"
    />

    <br />

    <input
      id="customLabels"
      type="text"
      placeholder="Example: anime,girl,jayden"
    />

    <br />

    <button onclick="uploadPhoto()">Upload</button>

    <div id="uploadStatus" class="status"></div>
  </div>

  <script>
    const API_BASE_URL = "https://udww739n7i.execute-api.us-east-1.amazonaws.com/prod";
    const API_KEY = "gWqGD7Zegp6ZS4VddfVZB5Cs2oTpURGa72fIf49W";

    async function searchPhotos() {
      const query = document.getElementById("searchText").value.trim();
      const resultsDiv = document.getElementById("results");
      const statusDiv = document.getElementById("searchStatus");

      resultsDiv.innerHTML = "";
      statusDiv.textContent = "";

      if (!query) {
        statusDiv.textContent = "Please enter a search query.";
        return;
      }

      try {
        statusDiv.textContent = "Searching...";

        const response = await fetch(
          `${API_BASE_URL}/search?q=${encodeURIComponent(query)}`,
          {
            method: "GET",
            headers: {
              "x-api-key": API_KEY
            }
          }
        );

        if (!response.ok) {
          throw new Error(`Search failed with status ${response.status}`);
        }

        const data = await response.json();

        const photos = data.results || [];
        const keywords = data.keywords || [];

        statusDiv.textContent =
          `Keywords: ${keywords.join(", ")} | Results: ${photos.length}`;

        if (photos.length === 0) {
          resultsDiv.innerHTML = "<p>No matching photos found.</p>";
          return;
        }

        photos.forEach(photo => {
          const card = document.createElement("div");
          card.className = "result-card";

          const title = document.createElement("div");
          title.innerHTML = `<strong>${photo.objectKey}</strong>`;

          const labels = document.createElement("div");
          labels.className = "small";
          labels.textContent = `Labels: ${(photo.labels || []).join(", ")}`;

          const bucket = document.createElement("div");
          bucket.className = "small";
          bucket.textContent = `Bucket: ${photo.bucket}`;

          const img = document.createElement("img");
          img.src = photo.url;
          img.alt = photo.objectKey;

          card.appendChild(title);
          card.appendChild(labels);
          card.appendChild(bucket);
          card.appendChild(img);

          resultsDiv.appendChild(card);
        });

      } catch (error) {
        console.error(error);
        statusDiv.textContent = error.message;
      }
    }

    async function uploadPhoto() {
      const fileInput = document.getElementById("photoFile");
      const labelsInput = document.getElementById("customLabels");
      const statusDiv = document.getElementById("uploadStatus");

      statusDiv.textContent = "";

      if (!fileInput.files || fileInput.files.length === 0) {
        statusDiv.textContent = "Please choose a photo.";
        return;
      }

      const file = fileInput.files[0];
      const customLabels = labelsInput.value.trim();

      try {
        statusDiv.textContent = "Uploading...";

        const response = await fetch(
          `${API_BASE_URL}/photos/${encodeURIComponent(file.name)}`,
          {
            method: "PUT",
            headers: {
              "x-api-key": API_KEY,
              "Content-Type": file.type || "image/jpeg",
              "x-amz-meta-customlabels": customLabels
            },
            body: file
          }
        );

        if (!response.ok) {
          throw new Error(`Upload failed with status ${response.status}`);
        }

        statusDiv.textContent =
          "Upload successful. Please wait 10-30 seconds, then search for your custom labels.";

      } catch (error) {
        console.error(error);
        statusDiv.textContent = error.message;
      }
    }
  </script>
</body>
</html>
